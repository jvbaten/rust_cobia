[package]
name = "distillation_shortcut_unit_editor"
version = "0.1.3"
edition = "2024"
authors = ["Jasper van Baten, AmsterCHEM"]
build = "build.rs"
license = "MIT"
repository = "https://github.com/jvbaten/rust_cobia"
description = "cobia example: Distillation Short-cut CAPE-OPEN Unit Operation Editor"
homepage = "https://www.amsterchem.com/cobiarust.html"
keywords = ["unit-operations", "CAPE OPEN", "shortcut-distillation", "chemical-engineering", "process-simulation"]
documentation = "https://www.amsterchem.com/rust_cobia_doc/distillation_shortcut_unit/"


[lib]
name = "distillation_shortcut_unit_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
ipc-channel = "0.22.0"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32", "Win32_UI", "Win32_UI_WindowsAndMessaging", "Win32_System", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
x11 = { version = "2.21.0" }
